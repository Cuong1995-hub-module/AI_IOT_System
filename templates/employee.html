<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Check In</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/employee.css') }}">

</head>

<body>

<div class="container">

    <!-- LEFT: MAIN CHECK-IN -->
    <div class="card">

        <h1>
            Samsung Innovation Campus
        </h1>

        <div class="team">
            SIC Nexus Embedded Team
        </div>

        <div class="subtitle">
            AI - IoT Security System
        </div>

        <div class="status">
            System Ready
        </div>

        <button id="btnCheckin">
            CHECK IN
        </button>

        <div class="footer">
            RFID • Face Recognition • AI • IoT
        </div>

    </div>


    <!-- RIGHT: TODAY'S CHECK-IN -->
    <div class="today-checkins">

        <div class="today-checkins-header">
            <span>📋</span>
            <span>Today's Check-in</span>
        </div>

        <div
            id="todayCheckinsList"
            class="today-checkins-list">

            <div class="checkin-empty">
                Chưa có lượt check-in hôm nay
            </div>

        </div>

    </div>

</div>

<!-- ===========================
     CHECK IN POPUP
=========================== -->

<div class="modal" id="checkinModal">

    <div class="modal-content">

        <div class="modal-header">

            Employee Check In

        </div>

     <div class="camera-preview-row">

    <!-- LIVE CAMERA -->
    <div class="camera-panel">

        <div class="panel-title">
            Live Camera
        </div>

        <img
            id="cameraPreview"
            src=""
            alt="Live Camera">

    </div>


    <!-- CAPTURED IMAGE -->
    <div class="camera-panel">

        <div class="panel-title">
            Captured Image
        </div>

        <img
            id="capturedPreview"
            src=""
            alt="Captured Image"
            style="display: none;">

        <div
            id="previewPlaceholder"
            class="preview-placeholder">

            No Image

        </div>

    </div>


    <canvas
        id="captureCanvas"
        style="display: none;">
    </canvas>

</div>
        <div class="info-box">

    <div class="info-row">

        <span>Name</span>

        <p id="userName">

            Waiting for RFID...

        </p>

    </div>

    <div class="info-row">

        <span>UID</span>

        <p id="uidText">

            Waiting RFID...

        </p>

    </div>

    <div class="info-row">

        <span>Time</span>

        <p id="checkTime">

            -- : -- : --
        </p>

    </div>

</div>
    <div class="button-group">

    <button
        class="capture-btn"
        id="btnCapture">

        Capture

    </button>

    <button
        class="checkin-submit-btn"
        id="btnCheckinSubmit"
        disabled>

        CHECK IN

    </button>

    <button
        class="cancel-btn"
        id="btnCancel">

        Cancel

    </button>

</div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/employee.js') }}"></script>

</body>

</html>
